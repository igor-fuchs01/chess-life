<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Plano em sete etapas, como um peão que avança de e2 até e8: documentação, VM e banco, login e cadastro, páginas públicas, partidas e gráficos, deploy e testes, e jogo contra a IA">
<style>
  .serif { font-family: Georgia, 'Times New Roman', Times, serif; }
