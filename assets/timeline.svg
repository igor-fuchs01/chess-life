  .caps { letter-spacing: 3px; text-transform: uppercase; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .walker { animation: walk 16s ease-in-out infinite; }
  @keyframes walk { 0% { transform: translateX(0); opacity: 0; } 3% { transform: translateX(0); opacity: 1; } 3.75% { transform: translateX(0px); } 6.25% { transform: translateX(150px); } 13.75% { transform: translateX(150px); } 16.25% { transform: translateX(300px); } 23.75% { transform: translateX(300px); } 26.25% { transform: translateX(450px); } 33.75% { transform: translateX(450px); } 36.25% { transform: translateX(600px); } 43.75% { transform: translateX(600px); } 46.25% { transform: translateX(750px); } 53.75% { transform: translateX(750px); } 56.25% { transform: translateX(900px); } 94% { transform: translateX(900px); opacity: 1; } 98%, 100% { transform: translateX(900px); opacity: 0; } }
  .crown { animation: crown 16s ease-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes crown { 0%, 56.25% { opacity: 0; transform: translateY(-14px) scale(0.6); } 59.38%, 94% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }</style>
