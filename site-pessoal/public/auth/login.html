<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Chess Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="alt">
      <div class="wrap auth">
        <div class="section-title"><div class="ornament">♔</div><h1>Bem-vindo de volta</h1></div>
        <form class="card" id="login-form" novalidate>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="voce@email.com" autocomplete="email">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" placeholder="Sua senha" autocomplete="current-password">
          <button class="btn" type="submit">Entrar</button>
          <div class="message" id="login-message" role="alert"></div>
          <p class="switch">Ainda não tem conta? <a href="signup.html">Cadastre-se</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../shared/session.js"></script>
  <script src="../shared/layout.js"></script>
  <script src="login.js"></script>
</body>
</html>
