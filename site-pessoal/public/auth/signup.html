<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Chess Life</title>
  <link rel="icon" type="image/svg+xml" href="../shared/logo.svg">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="auth.css">
  <script src="../shared/theme.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="alt">
      <div class="wrap auth wide">
        <div class="section-title"><div class="ornament">♔</div><h1>Crie a sua conta</h1><p>Registre as suas partidas e acompanhe a sua evolução.</p></div>
        <form class="card" id="signup-form" novalidate>
          <div class="field-row">
            <div>
              <label for="name">Nome</label>
              <input id="name" name="name" placeholder="Seu nome" autocomplete="name">
            </div>
            <div>
              <label for="email">E-mail</label>
              <input id="email" name="email" type="email" placeholder="voce@email.com" autocomplete="email">
            </div>
          </div>
          <div class="field-row">
            <div>
              <label for="password">Senha</label>
              <input id="password" name="password" type="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password">
            </div>
            <div>
              <label for="confirmation">Confirme a senha</label>
              <input id="confirmation" name="confirmation" type="password" placeholder="Repita a senha" autocomplete="new-password">
            </div>
          </div>
          <button class="btn" type="submit">Criar conta</button>
          <div class="message" id="signup-message" role="alert"></div>
          <p class="switch">Já tem conta? <a href="login.html">Entrar</a></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../shared/session.js"></script>
  <script src="../shared/layout.js"></script>
  <script src="signup.js"></script>
</body>
</html>
