<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title">
  <title id="title">Dragão Acelerado: 1.e4 c5 2.Cf3 Cc6 3.d4 cxd4 4.Cxd4 g6</title>
  <style>
    /* One 16s cycle: each move takes 0.6s, with 0.9s between moves (1.5s per move), then the final
       position stays on screen and the pieces fade out and back in before the opening starts again. */
    text {
      fill: #1f1a14;
      font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", serif;
      font-size: 40px;
      text-anchor: middle;
      dominant-baseline: central;
    }
    #pieces, #pieces text {
      animation-duration: 16s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    #pieces { animation-name: fade; }
    #white-e-pawn { animation-name: e4; }
    #black-c-pawn { animation-name: c5-cxd4; }
    #white-knight { animation-name: nf3-nxd4; }
    #black-knight { animation-name: nc6; }
    #white-d-pawn { animation-name: d4; }
    #black-g-pawn { animation-name: g6; }

    @keyframes fade {
      0%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    /* 1.e4 */
    @keyframes e4 {
      0%, 6.25% { transform: translate(0, 0); }
      10%, 100% { transform: translate(0, -100px); }
    }
    /* 1...c5, then 3...cxd4; the pawn is taken by 4.Cxd4 */
    @keyframes c5-cxd4 {
      0%, 15.625% { transform: translate(0, 0); }
      19.375%, 53.125% { transform: translate(0, 100px); opacity: 1; }
      56.875%, 64% { transform: translate(50px, 150px); opacity: 1; }
      66.25%, 100% { transform: translate(50px, 150px); opacity: 0; }
    }
    /* 2.Cf3, then 4.Cxd4 */
    @keyframes nf3-nxd4 {
      0%, 25% { transform: translate(0, 0); }
      28.75%, 62.5% { transform: translate(-50px, -100px); }
      66.25%, 100% { transform: translate(-150px, -150px); }
    }
    /* 2...Cc6 */
    @keyframes nc6 {
      0%, 34.375% { transform: translate(0, 0); }
      38.125%, 100% { transform: translate(50px, 100px); }
    }
    /* 3.d4; the pawn is taken by 3...cxd4 */
    @keyframes d4 {
      0%, 43.75% { transform: translate(0, 0); opacity: 1; }
      47.5%, 54.5% { transform: translate(0, -100px); opacity: 1; }
      56.875%, 100% { transform: translate(0, -100px); opacity: 0; }
    }
    /* 4...g6 */
    @keyframes g6 {
      0%, 71.875% { transform: translate(0, 0); }
      75.625%, 100% { transform: translate(0, 50px); }
    }

    /* Without motion, the board stops on the final position of the opening. */
    @media (prefers-reduced-motion: reduce) {
      #pieces, #pieces text {
        animation-delay: -13s;
        animation-play-state: paused;
      }
    }
  </style>
