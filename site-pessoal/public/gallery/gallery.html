<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria | Chess Life</title>
  <link rel="icon" type="image/svg+xml" href="../shared/logo.svg">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="gallery.css">
  <script src="../shared/theme.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="gallery">
      <div class="wrap">
        <div class="profile">
          <div class="avatar">♚</div>
          <div>
            <h1>@chesslife</h1>
            <div class="counts"><span><b>6</b> fotos</span><span><b>6/6</b> vitórias</span><span><b>1500</b> rating</span></div>
            <p>Momentos de torneios, medalhas e muitas horas de estudo.</p>
          </div>
        </div>
        <div class="photo-area">
          <div class="grid">
            <figure class="photo">
              <img src="../assets/jogando-xadrez.jpeg" alt="Alunos jogando xadrez em mesas lado a lado durante uma competição na escola">
              <figcaption>Concentração na competição da escola</figcaption>
            </figure>
            <figure class="photo">
              <img src="../assets/equipe-xadrez.jpeg" alt="Equipe de xadrez da escola com as medalhas no pescoço, ao lado da professora">
              <figcaption>A equipe e as medalhas de ouro</figcaption>
            </figure>
            <figure class="photo">
              <img src="../assets/chess-board.png" alt="Peças de xadrez em um tabuleiro de madeira, na penumbra">
              <figcaption>Horas de estudo no tabuleiro</figcaption>
            </figure>
            <figure class="photo">
              <img src="../assets/cartaz-obmep.jpg" alt="Faixa na escola parabenizando Igor Fuchs Pereira pela medalha de bronze na olimpíada de matemática de 2019">
              <figcaption>Bronze na olimpíada de matemática, em 2019</figcaption>
            </figure>
            <figure class="photo photo-bottom">
              <img src="../assets/medalha-obmep.jpg" alt="Medalha de bronze da OBMEP 2019, com a fita laranja e o estojo de veludo">
              <figcaption>A medalha de bronze da OBMEP 2019</figcaption>
            </figure>
            <figure class="photo">
              <img src="../assets/geometria-dark.png" alt="Desenhos de geometria e fórmulas matemáticas em um quadro negro">
              <figcaption>Do tabuleiro para a geometria</figcaption>
            </figure>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../shared/session.js"></script>
  <script src="../shared/layout.js"></script>
</body>
</html>
