<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria | Chess Life</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section>
      <div class="wrap">
        <div class="profile">
          <div class="avatar">♚</div>
          <div>
            <h1>@chesslife</h1>
            <div class="counts"><span><b>9</b> fotos</span><span><b>6/6</b> vitórias</span><span><b>1500</b> rating</span></div>
            <p>Momentos de torneios, medalhas e muitas horas de estudo.</p>
          </div>
        </div>
        <div class="grid">
          <figure class="photo tone-1">♞<figcaption>Primeira competição</figcaption></figure>
          <figure class="photo tone-2">♛<figcaption>Medalha de ouro da escola</figcaption></figure>
          <figure class="photo tone-3">♜<figcaption>Treino no clube</figcaption></figure>
          <figure class="photo tone-1">♝<figcaption>Bronze na OBMEP</figcaption></figure>
          <figure class="photo tone-2">♚<figcaption>Estudo de aberturas</figcaption></figure>
          <figure class="photo tone-3">♟<figcaption>Torneio regional</figcaption></figure>
          <figure class="photo tone-1">♞<figcaption>Análise de partida</figcaption></figure>
          <figure class="photo tone-2">♛<figcaption>Simultânea</figcaption></figure>
          <figure class="photo tone-3">♜<figcaption>Tabuleiro de casa</figcaption></figure>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../shared/session.js"></script>
  <script src="../shared/layout.js"></script>
</body>
</html>
