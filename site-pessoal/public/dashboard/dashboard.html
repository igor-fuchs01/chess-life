<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu desempenho | Chess Life</title>
  <link rel="icon" type="image/svg+xml" href="../shared/logo.svg">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="dashboard.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/session.js"></script>
  <script>requireSession();</script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="dash">
      <div class="wrap">
        <div class="section-title">
          <div class="ornament">♛</div>
          <h1>Meu desempenho no xadrez</h1>
          <p id="greeting"></p>
        </div>

        <div class="stats">
          <div class="stat">
            <b id="games-today">0</b>partidas hoje
            <span class="change" id="games-today-change"></span>
          </div>
          <div class="stat">
            <b id="win-rate">0%</b>de vitórias no total
            <span class="change" id="win-rate-change"></span>
          </div>
          <div class="stat">
            <b id="favorite-opening">—</b>abertura favorita
            <span class="change" id="favorite-opening-detail"></span>
          </div>
        </div>

        <div class="panels">
          <div class="panel wide"><h2>Partidas por semana</h2><canvas id="weekly-chart"></canvas></div>
          <div class="panel"><h2>Resultados</h2><canvas id="results-chart"></canvas></div>
          <div class="panel"><h2>Aberturas mais jogadas</h2><canvas id="openings-chart"></canvas></div>
          <div class="panel wide">
            <h2>Minhas partidas</h2>
            <div class="message" id="games-message" role="alert"></div>
            <p class="empty" id="games-empty">Nenhuma partida jogada ainda. As partidas que você jogar no site aparecem aqui.</p>
            <table class="games" id="games-table" hidden>
              <thead><tr><th>Data</th><th>Abertura</th><th>Adversário</th><th>Cor</th><th>Resultado</th><th></th></tr></thead>
              <tbody id="games-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../shared/layout.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
